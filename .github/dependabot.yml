# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      bun:
        patterns:
          - "*"
  # "uv", not "pip": the pip ecosystem reads the PEP 621 pins in
  # pyproject.toml but has no concept of uv.lock, so it opened PRs that
  # bumped the pin and left the lockfile on the old version. The uv
  # ecosystem understands both and keeps them in sync.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
    # A Django major is a deliberate migration, not something to ride in
    # on a routine grouped bump. Minor and patch updates still come
    # through. Matching is case-insensitive and exact, so django-stubs,
    # django-dbbackup and djangorestframework are unaffected.
    ignore:
      - dependency-name: "Django"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
