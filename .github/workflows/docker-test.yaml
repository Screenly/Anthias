name: Run Unit Tests

on:
  push:
    branches:
      - master
    paths:
      - '**/**'
      - '!.editorconfig'
      - '!README.md'
      - '!CONTRIBUTING.md'
      - '!website/**'
      # ...except the newsletter masthead, which only lives under
      # website/ so the site can host it. test_email_tokens.py checks
      # the plum baked into that PNG against --color-canvas, and the
      # check is worth nothing if it skips the commit that re-renders
      # it.
      - 'website/static/img/anthias-logo-email.png'
      - '!.github/workflows/build-balena-disk-image.yaml'
      - '!.github/release.yml'
      - '!.github/dependabot.yml'
      - '!docs/**'
      - '!.cursor/**'
      - '!.claude/**'
  pull_request:
    branches:
      - master
    paths:
      - '**/**'
      - '!.editorconfig'
      - '!README.md'
      - '!CONTRIBUTING.md'
      - '!website/**'
      # ...except the newsletter masthead, which only lives under
      # website/ so the site can host it. test_email_tokens.py checks
      # the plum baked into that PNG against --color-canvas, and the
      # check is worth nothing if it skips the commit that re-renders
      # it.
      - 'website/static/img/anthias-logo-email.png'
      - '!.github/workflows/build-balena-disk-image.yaml'
      - '!.github/release.yml'
      - '!.github/dependabot.yml'
      - '!docs/**'
      - '!.cursor/**'
      - '!.claude/**'
  workflow_call:

jobs:
  run-typescript-tests:
    uses: ./.github/workflows/test-runner.yml
    with:
      test-type: 'typescript'
      python-version: '3.13'

  run-python-tests:
    uses: ./.github/workflows/test-runner.yml
    with:
      test-type: 'python'
      python-version: '3.13'
      # Passed explicitly: relying on `github.event_name` inside the
      # called workflow would fail silently if the context does not carry
      # it through, and silence is the bug being fixed.
      caller-event-name: ${{ github.event_name }}
    # `workflow_call` does NOT inherit secrets, so without this the
    # reusable workflow saw an empty CODECOV_TOKEN however the repo was
    # configured. Passed explicitly rather than via `secrets: inherit` so
    # the test workflow only receives the one secret it needs.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
