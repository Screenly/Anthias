name: Deploy Anthias.screenly.io

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/deploy-website.yaml'
      - '.github/workflows/scripts/install-bun.sh'
      - 'website/**'

  # Re-deploy when the API schema changes. An API-only commit touches
  # no `website/**` path, so the filter above never fires and the API
  # reference page silently drifts from the running API — it had been
  # frozen since the Hugo migration, missing nine endpoints and eight
  # component schemas by the time anyone noticed. Chaining off the
  # schema workflow is what actually keeps the page honest; the fetch
  # step below only makes it *possible*.
  #
  # Note this makes the site redeploy on most master merges, since
  # generate-openapi-schema.yml itself runs on nearly every non-website
  # push. That is the cost of the page never being stale.
  workflow_run:
    workflows: ['Generate OpenAPI Schema']
    types:
      - completed
    branches:
      - master

  # Re-deploy when a release is cut: build-balena-disk-image.yaml
  # invokes this workflow via `gh workflow run` after it finishes
  # uploading rpi-imager.json to the release, so this job is
  # guaranteed to see the freshly-published asset (and won't ship an
  # empty os_list while the upload step is still in flight).
  workflow_dispatch:

# Permissions are scoped per-job below (least-privilege). The build
# job needs read-only access to the Actions and contents APIs (plus
# pages write so configure-pages can prepare the artifact); the
# deploy job needs pages:write + id-token:write to publish.

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.13'
  HUGO_VERSION: '0.157.0'

jobs:
  build:
    # A failed or cancelled schema run must not trigger a deploy: the
    # fetch step would find no successful run to pull from and ship the
    # committed fallback, quietly republishing a stale API page. Only
    # gates the workflow_run path; push and dispatch are unaffected.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # actions:read is required so the Fetch marketing screenshots and
      # Fetch OpenAPI schema steps can call `gh run list` /
      # `gh run download` against the Actions API — explicit permission
      # blocks default every unspecified scope to `none`.
      actions: read
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Install Hugo
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -O hugo.deb
          sudo dpkg -i hugo.deb
          rm hugo.deb
          hugo version

      # Manual bun install — same toolchain we use elsewhere in the
      # repo. The script verifies the archive's SHA-256 against the
      # release's SHASUMS256.txt before installing, avoiding the
      # remote-script execution of `curl bun.sh/install | bash`.
      - name: Install bun
        run: bash .github/workflows/scripts/install-bun.sh

      - name: Install website dependencies
        run: bun install --frozen-lockfile
        working-directory: website

      # Pull the high-DPI marketing captures produced by the
      # marketing-screenshots.yaml workflow. The home-page slider's
      # Hugo partial enumerates *.png entries from
      # website/assets/images/screenshots/ — the files are
      # gitignored, so this step is the canonical source on every
      # deploy. We resolve the latest *successful* run on master
      # (not by ref of the current deploy, because deploy-website is
      # triggered on master pushes and we want the most recent green
      # capture set regardless of which commit shipped it last).
      #
      # Missing run is a soft fail: the site builds with an empty
      # screenshots/ dir and the layout falls back gracefully (no
      # slider section, OG image falls back to logo.svg). That keeps
      # the first deploy after this change from being blocked by an
      # ordering chicken-and-egg.
      - name: Fetch marketing screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=website/assets/images/screenshots
          mkdir -p "$dest"
          run_id=$(gh run list \
            --workflow=marketing-screenshots.yaml \
            --branch=master \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::No successful marketing-screenshots run found on master; building without slider."
            exit 0
          fi
          echo "Fetching marketing-screenshots artifact from run $run_id"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh run download "$run_id" \
            --name marketing-screenshots \
            --dir "$tmp"
          # Copy PNGs only; ignore any unexpected sidecar files so
          # the layout can trust *everything* in the dir to be a
          # capture.
          find "$tmp" -maxdepth 1 -type f -name '*.png' -exec cp {} "$dest/" \;
          # ``find | wc -l`` avoids actionlint's SC2012 hit on
          # ``ls | wc -l`` (unsafe with newlines in filenames — moot
          # here since the artifact contents are workflow-controlled).
          count=$(find "$dest" -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "Installed $count screenshot files"
          find "$dest" -maxdepth 1 -type f -name '*.png' -printf '%f\n' | sort

      # Refresh website/data/openapi.json from the schema that
      # generate-openapi-schema.yaml built off master. `api.html` reads
      # it as `site.Data.openapi`, so without this the API reference is
      # whatever was committed — which is exactly how it went a year
      # without an update.
      #
      # The committed copy is a real fallback, not a placeholder: it
      # keeps `hugo server` working offline and means a missing artifact
      # degrades to a slightly stale page rather than a broken build.
      # That is why a missing run is a soft fail, matching the
      # screenshots step above. A *corrupt* artifact is not: it would
      # replace a good file with a bad one, so the JSON is validated
      # into a temp file and only moved into place once it parses and
      # carries the keys the layout dereferences.
      - name: Fetch OpenAPI schema
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=website/data/openapi.json
          run_id=$(gh run list \
            --workflow=generate-openapi-schema.yml \
            --branch=master \
            --status=success \
            --limit=1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::warning::No successful generate-openapi-schema run found on master; building with the committed schema."
            exit 0
          fi
          echo "Fetching anthias-api-schema artifact from run $run_id"
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          gh run download "$run_id" \
            --name anthias-api-schema \
            --dir "$tmp"
          src="$tmp/anthias-api-schema.json"
          # `paths` and `components.schemas` are both dereferenced by
          # layouts/partials/api-schema.html when it resolves a $ref; an
          # empty or partial document would render a blank page rather
          # than fail the build, so assert them here.
          jq -e '.openapi and (.info.title | type == "string")' "$src" > /dev/null
          jq -e '.paths | length > 0' "$src" > /dev/null
          jq -e '.components.schemas | length > 0' "$src" > /dev/null
          mv "$src" "$dest"
          echo "Installed OpenAPI schema: $(jq -r '.paths | length' "$dest") paths, $(jq -r '.components.schemas | length' "$dest") schemas"

      - name: Build website CSS
        run: bun run css:build
        working-directory: website

      - name: Build website
        run: hugo --source website --minify

      # Generate llms.txt / llms-full.txt from the rendered public/
      # tree (llmstxt.org convention). Reading the built HTML keeps
      # the files in sync with what visitors see, including marketing
      # copy that lives in Hugo layouts rather than content/*.md.
      - name: Generate llms.txt
        run: bun run llms:generate
        working-directory: website

      # Fetch rpi-imager.json from the latest GitHub release. The
      # file is built by build-balena-disk-image.yaml at release time
      # and Hugo serves it at /rpi-imager.json.
      #
      # We probe with `gh release view --json assets` first so we can
      # distinguish "release exists but asset is missing" (transition
      # fallback path; expected immediately after this refactor
      # lands) from transient errors (auth/rate-limit/network), which
      # must fail the deploy rather than silently ship an empty
      # os_list.
      - name: Fetch rpi-imager.json from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p website/public
          out=website/public/rpi-imager.json

          assets=$(gh release view \
            --json assets \
            --jq '[.assets[].name]')
          if echo "$assets" | jq -e 'index("rpi-imager.json")' > /dev/null; then
            gh release download \
              --pattern rpi-imager.json \
              --dir website/public \
              --clobber
            echo "Fetched rpi-imager.json from latest release"

            # Stronger validation than just `jq .`: catches a release
            # asset that's well-formed JSON but missing required
            # fields or carries the wrong types. Mirrors the checks
            # the old in-workflow regen step ran before this file
            # moved to being a release asset.
            jq -e '.os_list | type == "array"' "$out" > /dev/null
            jq -e '
              .os_list[] as $entry
              | ["name","description","icon","website","url",
                 "extract_size","extract_sha256","image_download_size",
                 "image_download_sha256","release_date"]
              | all(. as $k | $entry | has($k))
            ' "$out" > /dev/null
            jq -e '.os_list[] |
              (.extract_size | type == "number") and
              (.image_download_size | type == "number")' "$out" > /dev/null
            # Every entry should carry at least one hardware tag — an
            # untagged entry is silently dropped by Imager's
            # exclusive-matching devices (e.g. the Raspberry Pi 5). This
            # is a non-fatal warning, not a hard gate: a release built
            # before the generator started emitting `devices` would
            # otherwise block every website deploy until the next
            # release. New releases always include the field.
            if ! jq -e '[.os_list[] |
              (.devices | type == "array") and (.devices | length > 0)]
              | all' "$out" > /dev/null; then
              echo "::warning::rpi-imager.json has entries without a non-empty 'devices' tag; Imager may hide them on exclusive-matching devices (e.g. Pi 5). This is expected for a release cut before the generator started emitting 'devices'; if the current release should already be tagged, investigate the generator."
            fi
            jq -e '[.os_list[] | .name | test("pi1")] | any | not' "$out" > /dev/null
            jq -e '[.os_list[] | .url | startswith("https://")] | all' "$out" > /dev/null
            echo "rpi-imager.json validation passed"
          else
            echo "::warning::Latest release has no rpi-imager.json asset; shipping empty os_list."
            printf '%s\n' '{"os_list": []}' > "$out"
          fi

      - name: Show build output
        run: find website/public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
