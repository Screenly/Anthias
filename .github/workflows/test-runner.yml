name: Test Runner

on:
  workflow_call:
    inputs:
      test-type:
        description: 'Type of tests to run (typescript or python)'
        required: true
        type: string
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.13'
        type: string
      caller-event-name:
        description: >-
          The caller's `github.event_name`, passed explicitly rather than
          read from the `github` context here.

          The context is believed to carry the caller's event through a
          `workflow_call`, but the failure mode of being wrong is silent:
          the token warning below would simply never fire, which is the
          exact class of bug this change exists to stop. An explicit
          input costs one line and cannot be wrong. (Copilot review.)
        required: false
        default: ''
        type: string
    secrets:
      CODECOV_TOKEN:
        description: >-
          Codecov upload token. Declared explicitly (rather than relying
          on `secrets: inherit` at the call site) so this workflow only
          receives the one secret it needs, and so the dependency is
          visible here instead of being implied.

          Optional: without it, uploads from *unprotected* refs still
          work tokenlessly, which is what keeps fork PRs functional.
          Uploads from a protected branch are rejected with
          "Token required because branch is protected" — which is why
          master had no coverage baseline and every PR reported a missing
          BASE report.
        required: false

jobs:
  run-tests:
    name: Run ${{ inputs.test-type }} tests
    runs-on: ubuntu-24.04
    env:
      COMPOSE_FILE: docker-compose.test.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.9.17'

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --group docker-image-builder

      - name: Build Containers
        run: |
          uv run python -m tools.image_builder \
            --dockerfiles-only \
            --disable-cache-mounts \
            --service redis \
            --service test

      - name: Start the test container
        run: |
          docker compose up -d --build

      - name: Run TypeScript tests
        if: inputs.test-type == 'typescript'
        # Invokes the package.json `test` script rather than `bun test`
        # directly so the post-React tree (which has no .test.ts files)
        # can declare a no-op script and exit cleanly. When real tests
        # come back the script just needs to call `bun test` itself.
        run: |
          docker compose exec anthias-test \
            bun install --frozen-lockfile
          docker compose exec anthias-test \
            bun run test

      - name: Run Python unit tests
        if: inputs.test-type == 'python'
        run: |
          docker compose exec anthias-test \
            pytest -n auto -m "not integration" \
              --cov --cov-report=xml --cov-report=term

      - name: Setup integration test environment
        if: inputs.test-type == 'python'
        run: |
          docker compose exec anthias-test \
            bash ./bin/prepare_test_environment.sh -s

      # Snapshot the unit-only `.coverage` before the retry begins.
      # Each retry attempt restores from this snapshot before invoking
      # pytest, so partial line-hit data from a failed earlier attempt
      # cannot leak into the final coverage.xml via `--cov-append`.
      - name: Snapshot unit-only coverage data
        if: inputs.test-type == 'python'
        run: |
          docker compose exec anthias-test \
            cp .coverage .coverage.unit-snapshot

      # ANTHIAS_INTEGRATION_TEST=1 tells src/anthias_server/django_project/settings.py to
      # pin DATABASES.default.TEST.NAME to the same SQLite path the
      # anthias-server container reads. Playwright tests assert on
      # `Asset.objects.all()` after the server persists an upload, so
      # both ends must share one file. Unit tests must NOT set this
      # — they run under xdist and need pytest-django's default
      # per-worker `:memory:` DB to avoid file-lock contention.
      #
      # `--reuse-db` keeps pytest-django from running its default
      # destroy-and-recreate cycle on the SQLite file. The previous
      # step already migrated the file via `manage.py migrate` and
      # started uvicorn against it; if pytest-django were to delete
      # and recreate the file mid-run, uvicorn's open handle would
      # point at an unlinked inode while pytest's test process wrote
      # to the new one. `transaction=True` on integration tests still
      # flushes tables between tests for isolation.
      - name: Run Python integration tests
        if: inputs.test-type == 'python'
        run: |
          max_attempts=5
          timeout_minutes=5
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "::group::Attempt $attempt of $max_attempts"
            if timeout "${timeout_minutes}m" bash -c '
              docker compose exec anthias-test \
                cp .coverage.unit-snapshot .coverage
              docker compose exec -e ANTHIAS_INTEGRATION_TEST=1 anthias-test \
                pytest -m integration --reuse-db \
                  --cov --cov-append --cov-report=xml --cov-report=term
            '; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done
          echo "All $max_attempts attempts failed"
          exit 1

      # Surface a missing token instead of letting the upload fail
      # silently. codecov-action defaults to fail_ci_if_error: false, and
      # deliberately stays that way here — a Codecov outage must not block
      # a merge — but that also meant a *misconfiguration* was invisible:
      # master pushes were rejected with "Token required because branch is
      # protected" while the step still reported success, so no baseline
      # was ever stored and every PR warned about a missing BASE report.
      - name: Warn when Codecov has no token for a protected ref
        if: inputs.test-type == 'python' && inputs.caller-event-name == 'push'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "${CODECOV_TOKEN}" ]; then
            echo "::warning title=Codecov baseline will not be stored::CODECOV_TOKEN is empty, so this push's coverage upload will be rejected (\"Token required because branch is protected\"). Every PR will then report a missing BASE report. Set the CODECOV_TOKEN repo secret."
          fi

      # The /usr/src/app bind-mount means coverage.xml lands directly on
      # the runner workspace, so no docker cp is needed. Codecov picks it
      # up via the explicit `files:` argument.
      - name: Upload coverage reports to Codecov
        if: inputs.test-type == 'python'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./coverage.xml
          # The documented input. Also exported below because the
          # bundled CLI reads CODECOV_TOKEN from the environment.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Pinned explicitly rather than relying on the action's
          # default, which could change across major versions while the
          # comment above still claimed we depend on it. A Codecov
          # outage must never block a merge; the warning step above is
          # what keeps a *misconfiguration* from being silent.
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Browser-test failure artifacts (Playwright trace.zip +
      # full-page screenshot per failed test) are written by
      # pytest-playwright via the
      # `--tracing retain-on-failure --screenshot only-on-failure
      # --output test-artifacts` addopts in pyproject.toml. Same
      # bind-mount story as coverage.xml: anything inside the test
      # container under /usr/src/app shows up directly on the runner.
      # `if: failure()` keeps green runs from uploading an empty
      # bundle; `if-no-files-found: ignore` is a belt for the case
      # where the failure happens before any test reaches the
      # tracing-stop call. `playwright show-trace trace.zip` replays
      # the test interactively when downloading the bundle locally.
      - name: Upload integration test artifacts
        if: failure() && inputs.test-type == 'python'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the test container
        run: |
          docker compose down
