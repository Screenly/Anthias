name: Build Newsletter Email

# Validates emails/newsletter.mjml and publishes it as a downloadable
# zip on the run.
#
# What ships is the .mjml itself, not the compiled HTML. Mailjet takes
# MJML directly, and handing over the compiled output would mean handing
# over the one artefact nobody can edit: a change to a headline in 35 KB
# of nested tables is a change nobody will make in the source, which is
# how the sent mail and the repo stop being the same email.
#
# The compile still runs, as a check rather than as a deliverable: mjml
# in strict validation mode, and the size of what it produces measured
# against Gmail's clipping threshold. MJML expands a template several
# times over, so copy that reads as a paragraph in the source can be a
# few KB of output, and nothing you can see in the .mjml tells you how
# close you are.
#
# The masthead is referenced by URL from anthias.screenly.io rather than
# inlined. A base64 data: URI would make the file self-contained, but
# Gmail, Outlook and Yahoo all refuse to render one, which would put a
# broken image at the top of the newsletter for most of the list.

on:
  push:
    branches:
      - master
    paths:
      - 'emails/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-email.yaml'
  pull_request:
    branches:
      - master
    paths:
      - 'emails/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/build-email.yaml'
  # So a fresh bundle can be pulled off any ref without pushing a commit
  # to trigger one, which is the normal case when someone is about to
  # send and just wants the current template.
  workflow_dispatch:

# Nothing here reads or writes repository state. upload-artifact uses a
# separate API and does not read this block.
permissions:
  contents: read

env:
  # Gmail clips a message above this and hides the rest behind a "view
  # entire message" link, which in a newsletter usually lands mid-story.
  # The limit is on the whole message, so the compiled HTML has to leave
  # room for the headers and the encoding Mailjet adds around it.
  GMAIL_CLIP_BYTES: 102400

jobs:
  build:
    name: Build and package the newsletter
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      # No `bun install`. build:email runs mjml through bunx at a pinned
      # version rather than out of node_modules, precisely so it stays
      # off the dependency tree the device image builds from, so there is
      # nothing in the lockfile for this job to install.
      - name: Compile the template to validate it
        run: bun run build:email

      - name: Check the compiled size against Gmail's clipping threshold
        run: |
          size=$(stat -c%s emails/dist/newsletter.html)
          echo "Compiled newsletter: $size bytes (limit ${GMAIL_CLIP_BYTES})"
          echo "### Newsletter size" >> "$GITHUB_STEP_SUMMARY"
          echo "$size bytes of ${GMAIL_CLIP_BYTES} before Gmail clips." \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge "$GMAIL_CLIP_BYTES" ]; then
            # Built up in a variable because a workflow command has to be
            # one line, and a backslash continuation would fold this
            # block's indentation into the message the moment anyone
            # reindented it.
            msg="Compiled to $size bytes, at or over Gmail's"
            msg="$msg $GMAIL_CLIP_BYTES-byte clipping threshold."
            msg="$msg Cut copy or split the newsletter."
            echo "::error file=emails/newsletter.mjml::$msg"
            exit 1
          fi

      # The design must not live in the head, and compiling with the
      # head deleted is the only thing that proves it. The static guards
      # in tests/test_email_tokens.py can look for the two constructs
      # known to cause this; only mjml can tell you whether the result
      # actually still renders.
      #
      # The signal is MJML's own fallback text colour. It is #000000,
      # which on the plum canvas measures 1.6:1, and a single occurrence
      # means some element took a default instead of naming its colour.
      # That is exactly how this template shipped once: the whole design
      # sat in one mj-attributes block, and anything taking the body
      # without the head got black on purple, no cards, and MJML's
      # default padding, in a layout that still looked like an email.
      - name: Check the design survives without the head
        run: |
          sed '/<mj-head>/,/<\/mj-head>/d' emails/newsletter.mjml \
            > /tmp/headless.mjml
          bunx mjml@4.15.3 /tmp/headless.mjml -o /tmp/headless.html \
            --config.validationLevel=strict
          leaked=$(grep -c 'color:#000000' /tmp/headless.html || true)
          if [ "${leaked:-0}" -gt 0 ]; then
            msg="Compiled with mj-head removed, $leaked element(s) fell"
            msg="$msg back to MJML's default black, which is 1.6:1 on the"
            msg="$msg canvas. Set colour on the element, not in the head."
            echo "::error file=emails/newsletter.mjml::$msg"
            exit 1
          fi
          echo "No MJML defaults leaked with the head removed."

      # Only the source and the notes. No image: the template points at
      # the masthead hosted on the site, so the .mjml is already the
      # whole email. No compiled HTML either, for the reason at the top
      # of this file.
      - name: Assemble the bundle
        run: |
          # Named for the commit, and the zip's top-level directory is
          # the same name, so an extracted bundle still says which build
          # it came from once it is sitting in someone's Downloads.
          bundle="anthias-newsletter-${GITHUB_SHA:0:7}"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
          mkdir -p "$bundle"
          cp emails/newsletter.mjml "$bundle/"
          cp emails/README.md "$bundle/"

      # Zipped here rather than left to upload-artifact so the downloaded
      # file is one named, dated object a marketer can hand on, instead of
      # a loose tree named after the run. GitHub wraps any artifact in a
      # zip of its own, so downloading this yields a zip containing the
      # zip; that is the cost of the bundle having a real name.
      - name: Create the zip
        run: |
          zip -r -q "$BUNDLE.zip" "$BUNDLE"
          unzip -l "$BUNDLE.zip"

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: anthias-newsletter
          path: anthias-newsletter-*.zip
          if-no-files-found: error
          retention-days: 90
