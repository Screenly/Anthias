---
- name: Ensure folders exist
  ansible.builtin.file:
    path: "/home/{{ anthias_user }}/{{ item }}"
    state: directory
    owner: "{{ anthias_user }}"
    group: "{{ anthias_user }}"
    mode: "0755"
  with_items:
    - .anthias
    - .config
    - anthias_assets

- name: Create empty .asoundrc
  ansible.builtin.file:
    path: "/home/{{ anthias_user }}/.asoundrc"
    state: touch
    force: false
    group: "{{ anthias_user }}"
    owner: "{{ anthias_user }}"
    mode: "0644"

- name: Copy Anthias default assets file
  ansible.builtin.copy:
    owner: "{{ anthias_user }}"
    group: "{{ anthias_user }}"
    mode: "0644"
    src: default_assets.yml
    dest: "/home/{{ anthias_user }}/.anthias/default_assets.yml"
    force: true

- name: Remove deprecated parameter "listen"
  ansible.builtin.lineinfile:
    regexp: '^.*listen.*'
    state: absent
    dest: "/home/{{ anthias_user }}/.anthias/anthias.conf"

# install.sh is the single source of truth for both fresh installs and
# upgrades. We re-download it from the same ref the user is installing
# (anthias_branch) so a tag-pinned install gets the matching upgrade
# script, not master's. No checksum is pinned because the URL is
# expected to move with the ref; integrity is bounded by HTTPS to
# githubusercontent. If we ever ship signed release assets, switch
# to fetching the signed asset by tag.
- name: Install upgrade_anthias.sh from the configured branch
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/Screenly/Anthias/{{ anthias_branch }}/bin/install.sh"
    dest: /usr/local/sbin/upgrade_anthias.sh
    mode: "0700"
    owner: root
    group: root
    force: true

- name: Remove legacy sudoers file
  ansible.builtin.file:
    path: /etc/sudoers.d/screenly_overrides
    state: absent

- name: Install sudoers rule for Anthias user
  ansible.builtin.template:
    src: anthias_overrides.j2
    dest: /etc/sudoers.d/anthias_overrides
    mode: "0440"
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

# Journal persistence -- OFF by default, and deliberately so.
#
# Raspberry Pi OS ships
# /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf pinning
# Storage=volatile, and that is not an oversight to work around: a
# player runs from an SD card, and journald's pattern of small appends
# plus periodic fsync is close to the worst case for the write
# amplification those cards do internally. Measured on idle QA players
# carrying the normal Anthias stack: 19-28 MiB of journal a day, about
# 7-10 GiB a year, before any real content churn. Writing that to the
# card to make logs survive a reboot is a trade only the operator can
# make, so the role does not make it for them.
#
# /api/v2/system/logs does NOT need this. The host agent reads the
# volatile journal in /run perfectly well; the only thing persistence
# buys is history across a reboot. The API reports which one it got in
# its `persistent` field, so a device left on the default is honest
# about showing current-boot-only logs rather than silently truncated
# ones.
#
# Enable per-device with `anthias_journal_persistent: true`, e.g. on
# x86 boxes booting from an SSD, or on a device being actively
# debugged. anthias_journal_max_use caps the result either way.
- name: Configure journald persistence
  when: anthias_journal_persistent | bool
  block:
    # `mkdir -p` then `systemd-tmpfiles --create` is the recipe
    # documented in journald.conf(5); both halves are needed. tmpfiles
    # only *adjusts* this path (`z` lines in
    # /usr/lib/tmpfiles.d/systemd.conf), it does not create it -- and
    # creating it ourselves is not enough either, because the `a+` line
    # on the same path is what grants the `adm` group its read ACL.
    # Skip tmpfiles and adm-group journal access silently does not work
    # on a host where we made the directory.
    #
    # Creating this directory is itself a persistence switch on any
    # image without the Pi vendor drop-in -- Debian defaults to
    # Storage=auto, which means "persist if /var/log/journal exists" --
    # which is the other reason it sits inside this conditional.
    - name: Create the persistent journal directory
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        # Not ours to tighten: systemd pins this exact mode with
        # `z /var/log/journal 2755 root systemd-journal` in
        # /usr/lib/tmpfiles.d/systemd.conf, so a narrower value is
        # reset by the very next tmpfiles run -- including the one
        # below. The setgid bit is what makes journald's files inherit
        # the group.
        mode: "2755"  # NOSONAR (S2612)

    - name: Apply systemd's own journal directory policy
      # Normalises mode/ownership and installs the group ACLs journald
      # expects. Not conditional on the task above reporting changed: a
      # pre-existing directory created by something other than tmpfiles
      # needs the same treatment, and the command is idempotent.
      ansible.builtin.command:
        cmd: systemd-tmpfiles --create --prefix=/var/log/journal
      changed_when: false

    # journald.conf.d is not present on every image, and template: does
    # not create parent directories.
    - name: Ensure the journald drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        # Matches /etc/systemd's own drop-in directories, which ship
        # 0755 root:root. Holds no secrets, and has to stay traversable
        # for a non-root `systemd-analyze cat-config`.
        mode: "0755"  # NOSONAR (S2612)

    - name: Configure journald persistence and size caps
      ansible.builtin.template:
        src: anthias-journald.conf.j2
        # 99- prefix so this wins over vendor drop-ins read from the
        # same merged directory set. Raspberry Pi OS ships
        # /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
        # with Storage=volatile; an unprefixed name only beats it by
        # alphabetical luck.
        dest: /etc/systemd/journald.conf.d/99-anthias.conf
        # A non-secret systemd config file. 0644 root:root is what
        # every other file in /etc/systemd ships as, and what an
        # operator needs to read it back.
        mode: "0644"  # NOSONAR (S2612)
        owner: root
        group: root
      notify: Restart systemd-journald

# Converge the other way too, so flipping the flag back off actually
# restores the image default instead of leaving our override in place.
# Only this file is removed: /var/log/journal is left alone because it
# may predate Anthias and may hold logs the operator still wants, and
# on a Pi the vendor drop-in makes the directory inert anyway.
- name: Remove the journald persistence drop-in when not enabled
  when: not (anthias_journal_persistent | bool)
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/99-anthias.conf
    state: absent
  notify: Restart systemd-journald

- name: Install Anthias systemd units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  with_items: "{{ anthias_systemd_units }}"
  # Restart on change so an existing install picks up a unit edit — e.g.
  # the proxy EnvironmentFile added for GH #3239, which is only read when
  # the service (re)starts.
  notify: Restart Anthias systemd units

- name: Enable Anthias systemd services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  with_items: "{{ anthias_systemd_units }}"
