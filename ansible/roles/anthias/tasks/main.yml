---
- name: Ensure folders exist
  ansible.builtin.file:
    path: "/home/{{ anthias_user }}/{{ item }}"
    state: directory
    owner: "{{ anthias_user }}"
    group: "{{ anthias_user }}"
    mode: "0755"
  with_items:
    - .anthias
    - .config
    - anthias_assets

- name: Create empty .asoundrc
  ansible.builtin.file:
    path: "/home/{{ anthias_user }}/.asoundrc"
    state: touch
    force: false
    group: "{{ anthias_user }}"
    owner: "{{ anthias_user }}"
    mode: "0644"

- name: Copy Anthias default assets file
  ansible.builtin.copy:
    owner: "{{ anthias_user }}"
    group: "{{ anthias_user }}"
    mode: "0644"
    src: default_assets.yml
    dest: "/home/{{ anthias_user }}/.anthias/default_assets.yml"
    force: true

- name: Remove deprecated parameter "listen"
  ansible.builtin.lineinfile:
    regexp: '^.*listen.*'
    state: absent
    dest: "/home/{{ anthias_user }}/.anthias/anthias.conf"

# install.sh is the single source of truth for both fresh installs and
# upgrades. We re-download it from the same ref the user is installing
# (anthias_branch) so a tag-pinned install gets the matching upgrade
# script, not master's. No checksum is pinned because the URL is
# expected to move with the ref; integrity is bounded by HTTPS to
# githubusercontent. If we ever ship signed release assets, switch
# to fetching the signed asset by tag.
- name: Install upgrade_anthias.sh from the configured branch
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/Screenly/Anthias/{{ anthias_branch }}/bin/install.sh"
    dest: /usr/local/sbin/upgrade_anthias.sh
    mode: "0700"
    owner: root
    group: root
    force: true

- name: Remove legacy sudoers file
  ansible.builtin.file:
    path: /etc/sudoers.d/screenly_overrides
    state: absent

- name: Install sudoers rule for Anthias user
  ansible.builtin.template:
    src: anthias_overrides.j2
    dest: /etc/sudoers.d/anthias_overrides
    mode: "0440"
    owner: root
    group: root
    validate: /usr/sbin/visudo -cf %s

# Journal persistence. /api/v2/system/logs reads the host journal via
# anthias-host-agent, and on a stock host that journal is volatile:
# Storage=auto only persists when /var/log/journal exists, which plain
# Debian / Armbian images do not create -- and Raspberry Pi OS goes
# further, shipping a vendor drop-in that pins Storage=volatile
# outright. Without this the log endpoint can only ever show the
# current boot, and the reboot an operator is trying to explain is
# precisely what erased the evidence.
- name: Create the persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    # setgid so journald's own files inherit the group, matching what
    # `systemd-tmpfiles --create` would produce.
    mode: "2755"

# journald.conf.d is not present on every image, and template: does
# not create parent directories.
- name: Ensure the journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald persistence and size caps
  ansible.builtin.template:
    src: anthias-journald.conf.j2
    # 99- prefix so this wins over vendor drop-ins read from the same
    # merged directory set. Raspberry Pi OS ships
    # /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
    # with Storage=volatile; an unprefixed name only beats it by
    # alphabetical luck.
    dest: /etc/systemd/journald.conf.d/99-anthias.conf
    mode: "0644"
    owner: root
    group: root
  notify: Restart systemd-journald

- name: Install Anthias systemd units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  with_items: "{{ anthias_systemd_units }}"
  # Restart on change so an existing install picks up a unit edit — e.g.
  # the proxy EnvironmentFile added for GH #3239, which is only read when
  # the service (re)starts.
  notify: Restart Anthias systemd units

- name: Enable Anthias systemd services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  with_items: "{{ anthias_systemd_units }}"
