# Managed by Anthias — see ansible/roles/system/tasks/resilience.yml.
[Manager]
{% if system_watchdog_device != '' %}
# systemd opens this device, programs the timeout, and pings at half
# of it. Named explicitly rather than left to the /dev/watchdog0
# default because on a board with more than one watchdog the default
# is whichever registered first — on Rockchip that is the DesignWare
# block, which halts the board instead of resetting it.
WatchdogDevice={{ system_watchdog_device }}
RuntimeWatchdogSec={{ system_watchdog_timeout_sec }}
# Safety net for the second phase of a reboot, once PID 1 has been
# replaced by systemd-shutdown: a board that stalls while stopping
# services comes back instead of sitting dark.
RebootWatchdogSec={{ system_reboot_watchdog_sec }}
{% else %}
# Nothing on this board is known to reset it. Explicitly off rather
# than left to the distro default — on Raspberry Pi OS that default is
# 1m, and arming a watchdog that halts turns every wedge into a site
# visit.
RuntimeWatchdogSec=0
RebootWatchdogSec=0
{% endif %}
