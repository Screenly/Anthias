# Managed by Anthias — see ansible/roles/system/tasks/resilience.yml.
# The udev-provided name, which identifies the device by driver
# identity rather than by registration order (see the rules template).
watchdog-device = {{ system_watchdog_arm_path }}

# How long the device waits after the last pet before resetting. The
# driver clamps this to what it supports rather than failing, so a
# value the silicon cannot honour rounds instead of breaking the box
# (BCM2835 reports 60 s, the Rockchip DesignWare 30-44 s, softdog 60 s).
watchdog-timeout = {{ system_watchdog_timeout_sec }}

# Pet every interval seconds. Must stay well under the timeout, since
# a check that runs long has to finish before the device gives up.
interval = {{ system_watchdog_interval_sec }}

# The gate. Non-zero exit stops the petting and the board resets;
# see the script for why this is not watchdog.conf's own min-memory.
test-binary = /usr/local/sbin/anthias-watchdog-health
test-timeout = {{ system_watchdog_interval_sec }}

# Lock the daemon into RAM at realtime priority. Without this the one
# process that decides whether to reboot is itself a candidate for
# being swapped out by the pressure it is supposed to detect.
realtime = yes
priority = 1

# Don't attempt a graceful shutdown on failure. Under the memory
# pressure this exists for, `shutdown` is exactly the kind of thing
# that hangs — let the device reset instead of waiting on userspace
# that has already proven it cannot make progress.
watchdog-refresh-use-settimeout = yes
