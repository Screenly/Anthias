# Managed by Anthias — see ansible/roles/system/tasks/resilience.yml.
#
# systemd does the petting: PID 1 opens the device, programs the
# timeout, and pings at half of it. Raspberry Pi OS already enables
# this (RuntimeWatchdogSec=1m in
# /usr/lib/systemd/system.conf.d/40-rpi-enable-watchdog.conf); this
# drop-in overrides which device it uses and shortens the timeout.
[Manager]
{% if system_watchdog_arm_path | default('') != '' %}
# Pinned by identity, not by number: /dev/watchdogN is registration
# order, so on a board with both a hardware block and softdog the
# number can change across boots and land on the device this role
# rejected for halting instead of rebooting.
WatchdogDevice={{ system_watchdog_arm_path }}
RuntimeWatchdogSec={{ system_watchdog_timeout_sec }}
# Safety net for the second phase of a reboot, after PID 1 has been
# replaced by systemd-shutdown: a board that stalls while stopping
# services comes back instead of sitting dark.
RebootWatchdogSec={{ system_reboot_watchdog_sec }}
{% else %}
# No device on this host that anyone has measured actually resetting
# the board. Explicitly off, rather than left to the distro default:
# on Raspberry Pi OS that default is 1m, and on a board whose only
# watchdog halts instead of rebooting, arming it turns every wedge
# into a dead screen and a site visit.
RuntimeWatchdogSec=0
RebootWatchdogSec=0
{% endif %}
