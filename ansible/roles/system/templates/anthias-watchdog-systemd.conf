# Managed by Anthias — see ansible/roles/system/tasks/resilience.yml.
#
# The watchdog daemon owns the device so that petting is gated on a
# health check. systemd's own ping only proves PID 1 is scheduled,
# which a wedged board still is, and only one process can hold the
# device — so systemd has to let go.
[Manager]
RuntimeWatchdogSec=0
{% if (system_watchdog_device.stat.exists | default(false) | bool)
      and system_watchdog_arm_path | default('') != '' %}
# Pin the shutdown watchdog to the device we vetted. RebootWatchdogSec
# makes systemd open a watchdog again while stopping services, and with
# no WatchdogDevice it takes /dev/watchdog — which on a Rockchip host
# is the DesignWare block this role rejected for halting instead of
# rebooting. A hung shutdown would otherwise fire exactly the device we
# went out of our way to avoid.
#
# Gated on the node having been stat'd, not just on the resolver having
# printed a path: if the retries expired without the device appearing,
# this arms a device the role never validated.
WatchdogDevice={{ system_watchdog_arm_path }}
RebootWatchdogSec={{ system_reboot_watchdog_sec }}
{% else %}
# No vetted device on this host — none found, or the resolved node
# never appeared — so no shutdown watchdog either: the default would be
# the hardware one we declined to arm.
RebootWatchdogSec=0
{% endif %}
