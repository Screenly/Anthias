---
# Watchdog timeout systemd programs into the device; it pings at half
# of this. Every device in the fleet supports at least 30s (BCM2835
# reports 60s, softdog 60s) and drivers clamp rather than reject, so a
# board with a shorter maximum rounds down safely.
system_watchdog_timeout_sec: 30

# Cap on a hung shutdown, applied after PID 1 has been replaced by
# systemd-shutdown.
system_reboot_watchdog_sec: 5min

# Driver identities (/sys/class/watchdog/*/identity) measured to
# actually reset a board rather than halt it. Matched case-insensitively
# as an extended regex. Anything not matching — including drivers
# nobody has tested yet — gets softdog instead, which reboots through
# the kernel's ordinary restart path.
#
# Measured: Broadcom BCM2835 (Raspberry Pi) resets. Synopsys DesignWare
# (Rockchip) halts, and took two boards dark here, which is why this is
# an allowlist rather than a list of things to avoid.
system_watchdog_reboots_pattern: 'bcm2835'
