---
# Cap on a hung shutdown. The health-gated daemon owns the runtime
# watchdog (the role writes RuntimeWatchdogSec=0 so systemd lets go),
# but systemd still handles the shutdown path, and a device that
# stalls while stopping services should come back rather than sit dark
# until someone visits it. No runtime knob is offered alongside this
# on purpose: a configurable RuntimeWatchdogSec would only let an
# operator put systemd back into competition with the daemon for the
# one device either can hold.
system_reboot_watchdog_sec: 5min

# Watchdog device timeout. Every device in the fleet supports at least
# this (BCM2835 60 s on Pi, DesignWare 30-44 s on Rockchip, softdog
# 60 s on x86); drivers clamp rather than reject, so a board with a
# shorter maximum rounds down safely.
system_watchdog_timeout_sec: 30

# Pet interval, comfortably inside the timeout so a slow health check
# still lands before the device gives up.
system_watchdog_interval_sec: 10

# The stable name the udev rule gives the vetted watchdog. Both the
# daemon and systemd are pointed at this rather than at /dev/watchdogN,
# whose numbering is registration order and can change across boots.
system_watchdog_stable_name: anthias-watchdog
