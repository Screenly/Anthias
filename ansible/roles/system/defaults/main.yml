---
# How long PID 1 may go without pinging the hardware watchdog before
# the silicon resets the board. Note this only catches PID 1 stalling
# — see the measured limitation in tasks/resilience.yml before relying
# on it for anything else. systemd pings at half this interval, so
# 30 s means a ping every 15 s and a reset ~30 s into a real livelock.
#
# Overridable for a board whose watchdog cannot be set this low, or to
# lengthen it on hardware where a slow boot risks a reset loop. Drivers
# clamp to what they support rather than failing, so a value the
# silicon cannot honour rounds rather than breaking the install.
system_runtime_watchdog_sec: 30

# Cap on a hung shutdown. systemd re-arms the watchdog across reboot so
# a device that stalls while stopping services still comes back instead
# of sitting dark until someone visits it.
system_reboot_watchdog_sec: 5min

# Watchdog device timeout. Every device in the fleet supports at least
# this (BCM2835 60 s on Pi, DesignWare 30-44 s on Rockchip, softdog
# 60 s on x86); drivers clamp rather than reject, so a board with a
# shorter maximum rounds down safely.
system_watchdog_timeout_sec: 30

# Pet interval, comfortably inside the timeout so a slow health check
# still lands before the device gives up.
system_watchdog_interval_sec: 10
