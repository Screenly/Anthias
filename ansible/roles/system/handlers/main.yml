---
- name: Update GRUB
  ansible.builtin.command: update-grub
  changed_when: true

- name: Restart docker
  # Picks up /etc/systemd/system/docker.service.d/http-proxy.conf so
  # dockerd can pull from ghcr.io through the proxy. Runs at end of play,
  # before install.sh hands off to bin/upgrade_containers.sh (which pulls
  # the images), so the daemon already has the proxy by then.
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: Re-execute systemd to apply the watchdog settings
  # daemon-reexec, not daemon-reload: RuntimeWatchdogSec and
  # WatchdogDevice are read by the manager itself at startup, so only
  # re-executing PID 1 makes it open (or let go of) the device.
  ansible.builtin.systemd:
    daemon_reexec: true
