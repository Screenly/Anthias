---
- name: Update GRUB
  ansible.builtin.command: update-grub
  changed_when: true

- name: Restart docker
  # Picks up /etc/systemd/system/docker.service.d/http-proxy.conf so
  # dockerd can pull from ghcr.io through the proxy. Runs at end of play,
  # before install.sh hands off to bin/upgrade_containers.sh (which pulls
  # the images), so the daemon already has the proxy by then.
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true

- name: Disable active zram swap
  # SWAP=false only governs the next boot. Turn off whatever the unit
  # already created so the installer's swapoff intent holds from here
  # rather than from the next reboot. `failed_when: false` because a
  # board with no zram swap active is the state we wanted anyway.
  ansible.builtin.command: /sbin/swapoff /dev/zram0
  failed_when: false
  changed_when: true

- name: Reload systemd manager configuration
  # daemon-reexec, not daemon-reload: RuntimeWatchdogSec is read by the
  # manager itself at startup, so re-executing PID 1 is what makes it
  # open /dev/watchdog. A plain reload leaves the watchdog unarmed.
  ansible.builtin.systemd:
    daemon_reexec: true
