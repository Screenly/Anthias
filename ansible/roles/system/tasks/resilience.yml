---
# Recovery from a wedge: the board stops making progress and has to
# come back without a site visit. Two layers, because they fail in
# different places.
#
# Layer 1 — prevention. start_viewer.sh marks the process actually
# holding the memory as the OOM victim, so when the kernel does act it
# frees something. Swap policy is deliberately NOT set here: misc.yml
# already has the project's position on it, and zram in particular is
# a capacity win on small boards rather than something a watchdog role
# should quietly switch off.
#
# Layer 2 — reset. A watchdog device the box cannot pet once it is
# unhealthy.
#
# Layer 2 is deliberately NOT systemd's RuntimeWatchdogSec, which is
# what a first pass reaches for. Measured, on hardware:
#
#   * NanoPi R3S LTS, RuntimeWatchdogSec=30 armed and confirmed
#     (`Watchdog running with a hardware timeout of 44s`, PID 1 holding
#     /dev/watchdog0). Driven into a memory wedge the board stopped
#     answering SSH, then ICMP, and stayed down 13 minutes until it was
#     power-cycled by hand. No reset.
#   * Raspberry Pi OS already ships this: on every Pi in the fleet
#     (Pi 1 through Pi 5) systemd holds /dev/watchdog0 with a 60 s
#     BCM2835 timeout, unconfigured by us — and those boards wedge too.
#
# systemd's ping proves PID 1 is scheduled, not that the system works.
# PID 1 is small, resident and rarely what stalls, so it keeps petting
# while everything an operator cares about is gone. The watchdog daemon
# pets only while a health check passes, so starvation itself stops the
# petting. Only one process can hold the device, so systemd has to be
# told to let go first — that handover is the point of the drop-in.

- name: Look for a hardware watchdog
  ansible.builtin.stat:
    path: /dev/watchdog
  register: system_watchdog_hw

- name: Identify the watchdog driver
  ansible.builtin.slurp:
    src: /sys/class/watchdog/watchdog0/identity
  register: system_watchdog_identity
  failed_when: false
  when: system_watchdog_hw.stat.exists

# A watchdog is only useful if its reset actually brings the board
# back, and on Rockchip the hardware one does not. MEASURED, on a
# Rock Pi 4B (RK3399) with a health-gated daemon holding
# /dev/watchdog at a 30 s timeout:
#
#   daemon SIGSTOPped 10:26:46, board unreachable by 10:27:12 — so the
#   watchdog fired on schedule — and then stayed dark. No ping, no
#   SSH, nine minutes later. It needed a power cycle. A NanoPi R3S LTS
#   (RK3566, same Synopsys DesignWare IP) did the same thing.
#
# The DesignWare block asserts a SoC reset these boards do not come
# back from, so arming it converts a wedge into a dead screen.
#
# softdog does come back, because it reboots through the kernel's
# ordinary restart path rather than that SoC reset. Same board, same
# test, immediately afterwards:
#
#   daemon SIGSTOPped 10:48:47, unreachable by 10:49:23, back at
#   10:49:53 with uptime=20s.
#
# So an untrusted hardware watchdog is treated exactly like a missing
# one: fall through to softdog. This is also why the systemd handover
# below sets RuntimeWatchdogSec=0 rather than leaving the distro
# default — on these boards systemd arming the hardware watchdog is
# the failure, not the protection.
# Classify what is already there, by identity rather than by the
# presence of /dev/watchdog. Three things make the naive check wrong:
#
#   * an unreadable or empty identity must count as untrusted. Reading
#     it is allowed to fail, and `'designware' not in ''` is true, so a
#     default of '' would quietly arm an unidentifiable device — the
#     opposite of the fail-safe this is for.
#   * softdog registers a /dev/watchdog of its own. On the second run
#     of this role on an x86 host, the softdog persisted by the first
#     run looks exactly like "a hardware watchdog appeared", and
#     treating it as one makes every later run skip the configuration
#     it is supposed to be enforcing.
#   * DesignWare halts rather than reboots (measured; see below).
#
# So hardware is used only on a positive identification that is
# neither of those.
- name: Classify the watchdog device
  ansible.builtin.set_fact:
    system_watchdog_ident: >-
      {{ system_watchdog_identity.content | default('') | b64decode | lower | trim }}
  when: system_watchdog_hw.stat.exists

- name: Decide whether to use hardware or fall back to softdog
  ansible.builtin.set_fact:
    system_watchdog_use_hw: >-
      {{ system_watchdog_hw.stat.exists
         and (system_watchdog_ident | default('')) != ''
         and 'designware' not in (system_watchdog_ident | default(''))
         and 'software' not in (system_watchdog_ident | default('')) }}

- name: Report why the hardware watchdog is not being used
  ansible.builtin.debug:
    msg: >-
      Falling back to softdog:
      {{ 'no hardware watchdog present' if not system_watchdog_hw.stat.exists
         else ('driver identity unreadable, treating as untrusted'
               if (system_watchdog_ident | default('')) == ''
               else ('the existing device is softdog'
                     if 'software' in (system_watchdog_ident | default(''))
                     else 'this driver was measured halting the board rather than rebooting it')) }}
  when: not system_watchdog_use_hw

- name: Load the software watchdog where there is no hardware one
  # Plain modprobe rather than community.general.modprobe: this repo
  # ships no collection requirements, and one task is not worth making
  # every install pull a collection.
  ansible.builtin.command: modprobe softdog
  register: system_softdog
  changed_when: system_softdog.rc == 0
  failed_when: false
  when: not system_watchdog_use_hw

- name: Keep the software watchdog across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/anthias-softdog.conf
    content: |
      # Managed by Anthias: no hardware watchdog on this host, so the
      # kernel's software watchdog backs the reset instead.
      softdog
    mode: "0644"  # NOSONAR - modules-load.d entries are world-readable
    owner: root
    group: root
  when:
    - system_softdog is defined
    - system_softdog.rc is defined
    - system_softdog.rc == 0

# Which device to pet is not obvious once both exist. /dev/watchdog is
# an alias for whichever registered first, which on a Rockchip board is
# the DesignWare block — the one that halts. Loading softdog there adds
# watchdog1, and pointing the daemon at /dev/watchdog would arm exactly
# the device we fell back to avoid. Observed on the Rock Pi 4:
#
#   watchdog0 -> Synopsys DesignWare Watchdog
#   watchdog1 -> Software Watchdog        <- the one that reboots
#
# So resolve by identity rather than by name.
- name: Resolve which watchdog device to pet
  ansible.builtin.shell: |
    set -o pipefail
    want_soft={{ (not system_watchdog_use_hw) | ternary('yes', 'no') }}
    for w in /sys/class/watchdog/watchdog*; do
      [ -r "$w/identity" ] || continue
      id=$(tr '[:upper:]' '[:lower:]' < "$w/identity")
      # Second field is the identity verbatim (not lowercased): the
      # udev rule below matches on it exactly.
      case "$id" in
        *software*) [ "$want_soft" = yes ] && { printf '%s\t%s\n' "/dev/$(basename "$w")" "$(cat "$w/identity")"; exit 0; } ;;
        *)          [ "$want_soft" = no  ] && { printf '%s\t%s\n' "/dev/$(basename "$w")" "$(cat "$w/identity")"; exit 0; } ;;
      esac
    done
    exit 1
  args:
    executable: /bin/bash
  register: system_watchdog_path
  changed_when: false
  failed_when: false

# Stat the resolved /dev/watchdogN, not /dev/watchdog: after modprobe
# the sysfs entry the resolver reads can appear before udev has made
# the numbered node, and gating on the alias would let the role sail
# on with a watchdog-device that does not exist yet — failing later,
# at the verification step, instead of waiting a moment here.
- name: Wait for the resolved watchdog node to appear
  ansible.builtin.stat:
    path: "{{ (system_watchdog_path.stdout | default('')).split('\t') | first | trim }}"
  register: system_watchdog_device_raw
  until: system_watchdog_device_raw.stat.exists | default(false)
  retries: 5
  delay: 1
  failed_when: false
  when: (system_watchdog_path.stdout | default('')).split('\t') | first | trim != ''

# Present *and* trusted to actually reboot. A board whose watchdog
# only halts is left alone rather than armed.
# Arm only what we could actually resolve. A board with no hardware
# watchdog and no softdog module — a Raspberry Pi would be the case, if
# Pi hardware didn't always provide one — ends up here with nothing,
# and is left alone rather than half-configured.
- name: Settle whether there is a watchdog worth arming
  ansible.builtin.set_fact:
    system_watchdog_dev_path: "{{ (system_watchdog_path.stdout | default('')).split('\t') | first | trim }}"
    # Verbatim, because the udev rule compares it byte for byte. A
    # double quote would break out of the rule's quoting, so an
    # identity containing one is treated as unusable and the role
    # keeps the numeric path (what it did before the rule existed).
    system_watchdog_ident_exact: >-
      {{ ((system_watchdog_path.stdout | default('')).split('\t')[1:] | first | default('') | trim)
         if '"' not in ((system_watchdog_path.stdout | default('')).split('\t')[1:] | first | default(''))
         else '' }}
    system_watchdog_device:
      stat:
        exists: >-
          {{ (system_watchdog_path.rc | default(1)) == 0
             and ((system_watchdog_path.stdout | default('')).split('\t') | first | trim) != ''
             and (system_watchdog_device_raw.stat.exists | default(false)) }}

# Pin the daemon and systemd to a name that survives a reboot.
# /dev/watchdogN is handed out in registration order: on a Rockchip
# host the DesignWare block and the softdog this role loads can swap
# numbers on a later boot, and a config pinned to the number would
# then arm the device that halts instead of rebooting — the exact
# failure the classification above exists to prevent. The rule matches
# the driver identity, which boot order cannot change.
- name: Give the vetted watchdog a stable name
  ansible.builtin.template:
    src: anthias-watchdog.rules
    dest: /etc/udev/rules.d/60-anthias-watchdog.rules
    mode: "0644"  # NOSONAR - udev requires readable rules
    owner: root
    group: root
  when:
    - system_watchdog_device.stat.exists | bool
    - system_watchdog_ident_exact != ''

# Unconditional rather than gated on the template having changed: udev
# holds rules in memory, so a host that already has the file but was
# rebooted into a kernel without the link still needs the reload, and
# both commands are idempotent and take milliseconds.
- name: Apply the rule to the device that is already registered
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false
  when:
    - system_watchdog_device.stat.exists | bool
    - system_watchdog_ident_exact != ''

- name: Trigger the symlink for the running kernel
  ansible.builtin.command: udevadm trigger --subsystem-match=watchdog --settle
  changed_when: false
  when:
    - system_watchdog_device.stat.exists | bool
    - system_watchdog_ident_exact != ''

- name: Wait for the stable watchdog name
  ansible.builtin.stat:
    path: "/dev/{{ system_watchdog_stable_name }}"
    follow: false
  register: system_watchdog_stable_stat
  until: system_watchdog_stable_stat.stat.exists | default(false)
  retries: 5
  delay: 1
  failed_when: false
  when:
    - system_watchdog_device.stat.exists | bool
    - system_watchdog_ident_exact != ''

# Use the stable name, or arm nothing. Falling back to
# /dev/watchdogN would reintroduce exactly the failure the rule exists
# to prevent: the number is registration order, so a later boot — a
# kernel that gained a driver, the softdog this role loads registering
# first — can point the same path at the device measured to halt the
# board. An unprotected board is recoverable by hand; a board that
# halts on every wedge is not. Every target runs systemd-udevd, so
# this arms in practice and fails closed only when something is
# genuinely wrong.
- name: Settle which path the daemon and systemd are pointed at
  ansible.builtin.set_fact:
    system_watchdog_arm_path: >-
      {{ ('/dev/' + system_watchdog_stable_name)
         if ((system_watchdog_stable_stat.stat.exists | default(false))
             and (system_watchdog_stable_stat.stat.lnk_source | default('')) == system_watchdog_dev_path)
         else '' }}

- name: Report that the stable name could not be used
  ansible.builtin.debug:
    msg: >-
      udev did not produce /dev/{{ system_watchdog_stable_name }}
      resolving to {{ system_watchdog_dev_path }}, so no watchdog is
      being armed: a numeric path can be renumbered into the device
      this run rejected.
  when:
    - system_watchdog_device.stat.exists | bool
    - system_watchdog_arm_path == ''

# From here on, "there is a watchdog to arm" means the identity-named
# device — not merely a node that was found.
- name: Settle whether there is a watchdog to arm
  ansible.builtin.set_fact:
    system_watchdog_device:
      stat:
        exists: "{{ system_watchdog_arm_path != '' }}"

# A host that had a safe watchdog on an earlier run and does not now
# (softdog stopped loading, the driver identity changed under a kernel
# upgrade) must not be left with the previous run's daemon still
# petting a device this run rejected. The drop-in below is rewritten
# either way — its no-device branch sets RebootWatchdogSec=0 — so the
# only stale piece to clear is the daemon itself.
- name: Stop the daemon when this run found nothing safe to arm
  ansible.builtin.systemd:
    name: watchdog
    enabled: false
    state: stopped
  register: system_watchdog_teardown
  failed_when:
    - system_watchdog_teardown is failed
    - not (system_watchdog_teardown.msg | default('') is search('(?i)could not find|not found|no such file'))
  when: not system_watchdog_device.stat.exists

- name: Remove the stale identity rule when nothing is armed
  ansible.builtin.file:
    path: /etc/udev/rules.d/60-anthias-watchdog.rules
    state: absent
  when: not system_watchdog_device.stat.exists

- name: Install the watchdog daemon
  ansible.builtin.apt:
    name: watchdog
    state: present
  when: system_watchdog_device.stat.exists

- name: Install the watchdog health gate
  ansible.builtin.copy:
    src: anthias-watchdog-health
    dest: /usr/local/sbin/anthias-watchdog-health
    mode: "0755"  # NOSONAR - executed by the watchdog daemon
    owner: root
    group: root
  when: system_watchdog_device.stat.exists

# Debian's watchdog package ships wd_keepalive, which pets the device
# whenever the main daemon is not running — so an operator can stop the
# daemon without the box resetting. For us that is precisely backwards:
# it means a health daemon that has died, or one that deliberately
# stopped petting, gets covered for and the board never resets.
# Measured on x86: with the main daemon stopped and the device armed at
# 30 s, wd_keepalive held the box up indefinitely.
- name: Stop wd_keepalive covering for a failed health daemon
  ansible.builtin.lineinfile:
    path: /etc/default/watchdog
    regexp: '^#?\s*run_wd_keepalive='
    line: run_wd_keepalive=0
    create: true
    mode: "0644"  # NOSONAR - distro default for /etc/default entries
    owner: root
    group: root
  when: system_watchdog_device.stat.exists

- name: Mask wd_keepalive
  ansible.builtin.systemd:
    name: wd_keepalive
    enabled: false
    masked: true
    state: stopped
  register: system_wd_keepalive
  # Only an absent unit is acceptable. A mask that failed for any other
  # reason must stop the run: wd_keepalive pets the device whenever the
  # main daemon is not running, so leaving it live means a health
  # daemon that died is covered for and the board never resets — while
  # the fd check further down still passes and reports protection.
  failed_when:
    - system_wd_keepalive is failed
    - not (system_wd_keepalive.msg | default('') is search('(?i)could not find|not found|no such file'))
  when: system_watchdog_device.stat.exists

- name: Read back the service state
  ansible.builtin.service_facts:
  when: system_watchdog_device.stat.exists

- name: Confirm wd_keepalive cannot cover for the health daemon
  ansible.builtin.assert:
    that:
      - (ansible_facts.services['wd_keepalive.service'] | default({})).get('status', 'not-found') in ['masked', 'not-found']
      - (ansible_facts.services['wd_keepalive.service'] | default({})).get('state', 'stopped') != 'running'
    fail_msg: >-
      wd_keepalive is still available on this host, so it would pet the
      watchdog whenever the health daemon is not running and the board
      would never reset.
    success_msg: wd_keepalive is masked or absent.
  when: system_watchdog_device.stat.exists

- name: Configure the watchdog daemon
  ansible.builtin.template:
    src: watchdog.conf
    dest: /etc/watchdog.conf
    mode: "0644"  # NOSONAR - read by the daemon at startup
    owner: root
    group: root
  when: system_watchdog_device.stat.exists
  notify: Restart watchdog daemon

# Hand the device over. systemd opens /dev/watchdog when
# RuntimeWatchdogSec is non-zero — the Raspberry Pi OS default — and
# only one process can hold it, so the daemon cannot start until
# systemd lets go. Explicit 0 rather than relying on the distro
# default, which differs between Pi OS and Debian.
# Ordering matters, and getting it wrong is silent. Only one process
# can hold /dev/watchdog: on Raspberry Pi OS systemd already owns it,
# so a daemon started before systemd lets go opens nothing, logs
# `alive=[none]`, and reports active while protecting nothing —
# observed on a Pi 4 doing exactly that. The re-exec is a normal task
# rather than a handler for this reason: handlers flush at the end of
# the play, which is after the daemon would have started.
- name: Ensure the systemd drop-in directory exists
  # `copy` does not create parent directories, and a clean Debian or
  # Raspberry Pi host may not ship /etc/systemd/system.conf.d — which
  # would fail first provisioning right before the handover. Same
  # pattern the Docker drop-in uses.
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: "0755"  # NOSONAR - systemd requires this readable
    owner: root
    group: root

- name: Release the watchdog device from systemd
  ansible.builtin.template:
    src: anthias-watchdog-systemd.conf
    dest: /etc/systemd/system.conf.d/anthias-watchdog.conf
    mode: "0644"  # NOSONAR - systemd requires world-readable drop-ins
    owner: root
    group: root
  # Written on every host, with no `when`. Not because every host has
  # a watchdog, but because the two things this file says both matter
  # when one is missing: systemd must be stopped from arming a
  # hardware watchdog this role classified as unsafe, and a host that
  # had a safe device on an earlier run must not keep that run's
  # WatchdogDevice once this run has none. An unconditional write is
  # also the only version with no stale-state case to reason about.
  notify: Re-execute systemd to release the watchdog device

# The ordering is the point, so make it explicit rather than leave it
# to end-of-play handler flushing: only one process can hold
# /dev/watchdog, and a daemon started before systemd lets go opens
# nothing, logs alive=[none], and reports active while protecting
# nothing (observed on a Pi 4). Flushing here runs the handover
# handler now, and keeps the intent visible to anyone reordering these
# tasks later.
- name: Apply the handover before anything tries to claim the device
  ansible.builtin.meta: flush_handlers

- name: Enable the watchdog daemon
  ansible.builtin.systemd:
    name: watchdog
    enabled: true
    state: restarted
  when: system_watchdog_device.stat.exists

# A daemon that failed to open the device still reports active, so
# "the service is running" proves nothing. Check the thing that
# matters: the process holds an fd on the watchdog.
# Match the resolved path exactly. Counting any fd containing
# "watchdog" would also pass if the daemon had opened /dev/watchdog0 —
# the unsafe DesignWare alias — and report protection while the wrong
# device was armed. The comparison is against the numeric path even
# when the daemon was pointed at the udev name, because /proc/PID/fd
# shows what the symlink resolved to; that it resolved to this device
# is exactly what wants confirming.
- name: Confirm the daemon holds the watchdog device we resolved
  ansible.builtin.shell: >-
    set -o pipefail;
    ls -l /proc/$(pgrep -x watchdog | head -1)/fd 2>/dev/null
    | grep -c -- '-> {{ system_watchdog_dev_path }}$'
  args:
    executable: /bin/bash
  register: system_watchdog_held
  changed_when: false
  failed_when: system_watchdog_held.stdout | trim | int < 1
  when: system_watchdog_device.stat.exists
