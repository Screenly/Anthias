---
# cosign verifies the Sigstore signatures docker-build.yaml attaches to
# every ghcr.io/screenly/anthias-* image; bin/upgrade_containers.sh
# refuses to start a pulled image it can't verify. Debian doesn't ship
# cosign on every release we install onto, so take the static upstream
# binary and pin it by checksum. To bump, take the three hashes from the
# release's cosign_checksums.txt.
- name: Install cosign
  ansible.builtin.get_url:
    url: "https://github.com/sigstore/cosign/releases/download/{{ system_cosign_version }}/cosign-linux-{{ system_cosign_arch }}"
    dest: /usr/local/bin/cosign
    checksum: "sha256:{{ system_cosign_sha256[system_cosign_arch] }}"
    owner: root
    group: root
    # Run by the unprivileged anthias user from upgrade_containers.sh.
    mode: "0755"  # NOSONAR
  vars:
    system_cosign_version: v3.1.4
    # cosign names its armhf build plain `arm`. system_architecture is
    # set in docker.yml, which runs first.
    system_cosign_arch: "{{ {'amd64': 'amd64', 'arm64': 'arm64', 'armhf': 'arm'}[system_architecture] }}"
    system_cosign_sha256:
      amd64: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
      arm64: ade83b7aac62e131cacfe96d958948b2150cc9efec46a570a2649b8e27dedad2
      arm: 09e77a313910cf5c4774508d85d017d9c60983f41bf657f83ecbd3892f7952cb
