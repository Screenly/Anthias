---
- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    # /etc/apt/keyrings is the convention from the Debian docs and must
    # be world-traversable so the unprivileged `_apt` user can read keys.
    mode: "0755"  # NOSONAR

# get_url still contacts the server even with the default force: no when
# dest exists (it issues a conditional request), so it needs network/proxy
# access every run. Guard it behind a stat so a host with the key already
# in place (e.g. pre-provisioned, or a re-run) needs no network at all
# (GH #3239 point 2).
- name: Check for existing Docker apt key
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: system_docker_apt_key

- name: Add Docker apt key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    # World-readable required so the `_apt` user can verify packages.
    mode: "0644"  # NOSONAR
  when: not system_docker_apt_key.stat.exists

- name: Set system_architecture
  ansible.builtin.set_fact:
    # Map every validated device_type (see site.yml) to a dpkg
    # architecture. Exhaustive by design: an unmapped device_type
    # raises rather than falling through to a default. The previous
    # form used `device_type in ['pi4', 'pi5']`, which silently
    # missed `pi4-64` after #2779 renamed the value, and every Pi 4
    # ran an upgrade resolving to armhf as a result.
    system_architecture: "{{ docker_arch_by_device_type[device_type] }}"
  vars:
    docker_arch_by_device_type:
      x86: amd64
      pi5: arm64
      pi4-64: arm64
      pi3-64: arm64
      pi3: armhf
      pi2: armhf
      arm64: arm64

- name: Add Docker repo
  # copy, not lineinfile, so a stale `[arch=...]` entry from an earlier
  # run is rewritten rather than left sitting alongside the correct one.
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >
      deb [arch={{ system_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    owner: root
    group: root
    # World-readable required so the `_apt` user can read the source list.
    mode: "0644"  # NOSONAR

- name: Install Docker
  # On hosts already running the wrong arch, apt swaps automatically:
  # docker-ce is Multi-Arch: foreign so requesting `:arm64` removes
  # the `:armhf` install (and pulls dependencies in the new arch).
  #
  # docker-buildx-plugin is a *Recommends* of docker-ce, and
  # `install_recommends: false` above means we have to name it
  # explicitly. Required for any `upgrade_containers.sh MODE=build`
  # run — our Dockerfiles use `FROM --platform=$BUILDPLATFORM …`
  # (see e.g. docker/Dockerfile.server.j2's bun-builder stage),
  # which the legacy `docker build` builder can't parse and dies
  # on at the very first FROM ("failed to parse platform"). The
  # buildkit-backed plugin handles `$BUILDPLATFORM` correctly. Pull-
  # mode boards don't need it for the steady-state path but the
  # plugin is ~15 MB to download / ~67 MB extracted (numbers from
  # the docker-buildx-plugin_0.33.0 deb on arm64), so installing
  # unconditionally is cheaper than diverging the apt list per board.
  ansible.builtin.apt:
    name:
      - docker-ce:{{ system_architecture }}
      - docker-ce-cli:{{ system_architecture }}
      - docker-compose-plugin:{{ system_architecture }}
      - docker-buildx-plugin:{{ system_architecture }}
    update_cache: true
    install_recommends: false

# Give dockerd the proxy (GH #3239) so it can pull images from ghcr.io
# behind an HTTP proxy. This must come after Docker is installed (the
# unit has to exist), unlike the early apt/env proxy config in proxy.yml.
# The drop-in points at /etc/anthias/proxy.env (written by proxy.yml) so
# the daemon shares the single source of truth.
- name: Create docker.service.d drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    # Standard 0755 for a systemd unit drop-in dir (systemd must traverse
    # it); world-traversable is expected here, same as /etc/apt/keyrings.
    mode: "0755"  # NOSONAR
  when: anthias_proxy_enabled | bool

- name: Install Docker daemon HTTP proxy drop-in
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/http-proxy.conf
    owner: root
    group: root
    mode: "0644"  # NOSONAR
    content: |
      # Managed by Anthias — HTTP proxy support (GH #3239).
      [Service]
      EnvironmentFile=-/etc/anthias/proxy.env
  when: anthias_proxy_enabled | bool
  notify: Restart docker

- name: Remove Docker daemon HTTP proxy drop-in when proxy disabled
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d/http-proxy.conf
    state: absent
  when: not (anthias_proxy_enabled | bool)
  notify: Restart docker

# Several of these groups (netdev, input, plugdev, gpio) are normally
# created by udev / network-manager / raspi-config. On a minimal
# Debian/x86 image they may be missing, so create them up-front. This
# is a no-op when they already exist.
- name: Ensure required groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
    system: true
  loop: "{{ anthias_required_groups }}"
  vars:
    anthias_required_groups: >-
      {{ anthias_base_groups +
         (anthias_pi_groups if device_is_pi else []) }}
    anthias_base_groups: &base_groups
      - docker
      - adm
      - sudo
      - video
      - plugdev
      - users
      - input
      - netdev
      - dialout
    anthias_pi_groups: &pi_groups
      - gpio
    # Derive Pi-ness from device_type, not CPU architecture. Both are
    # available here, but architecture also matches `arm64`
    # (and any other future non-Pi aarch64 host), which would silently
    # apply Pi-specific group/user logic to it. device_type is the
    # authoritative discriminator and is validated upstream in
    # ansible/site.yml's pre_tasks.
    device_is_pi: &is_pi >-
      {{ device_type in ['pi2', 'pi3', 'pi3-64', 'pi4-64', 'pi5'] }}

- name: Ensure Anthias user is in required groups
  ansible.builtin.user:
    name: "{{ anthias_user }}"
    group: "{{ anthias_user }}"
    append: true
    groups: "{{ anthias_base_groups + (anthias_pi_groups if device_is_pi else []) }}"
  vars:
    anthias_base_groups: *base_groups
    anthias_pi_groups: *pi_groups
    device_is_pi: *is_pi
