---
# Disable + remove the legacy wifi-connect.service unit on hosts
# upgraded from a release that shipped it. The service launched the
# anthias-wifi-connect container, which has been removed; the unit is
# now a dangling reference that systemd would log on every boot.
# Idempotent: skipped on fresh installs where the unit file is absent.
- name: Check for legacy wifi-connect.service
  ansible.builtin.stat:
    path: /etc/systemd/system/wifi-connect.service
  register: network_legacy_wifi_connect_unit

- name: Disable legacy wifi-connect.service
  ansible.builtin.systemd:
    name: wifi-connect.service
    state: stopped
    enabled: false
  when: network_legacy_wifi_connect_unit.stat.exists
  failed_when: false

- name: Remove legacy wifi-connect.service unit file
  ansible.builtin.file:
    path: /etc/systemd/system/wifi-connect.service
    state: absent
  notify: Reload systemd daemon

- name: Debug msg for manage network
  ansible.builtin.debug:
    msg: "Manage network: {{ manage_network }}"

- name: Add current user to Identity
  ansible.builtin.replace:
    regexp: '^Identity=.*'
    replace: "Identity=unix-group:netdev;unix-group:sudo:{{ anthias_user }}"
    dest: /var/lib/polkit-1/localauthority/10-vendor.d/org.freedesktop.NetworkManager.pkla
  when:
    - manage_network|bool
    - ansible_facts['distribution_major_version']|int <= 12

- name: Set ResultAny to yes
  ansible.builtin.replace:
    regexp: '^ResultAny=.*'
    replace: 'ResultAny=yes'
    dest: /var/lib/polkit-1/localauthority/10-vendor.d/org.freedesktop.NetworkManager.pkla
  when:
    - manage_network|bool
    - ansible_facts['distribution_major_version']|int <= 12

- name: Get stat of org.freedesktop.NetworkManager.pkla
  ansible.builtin.stat:
    path: /etc/polkit-1/localauthority/50-local.d/org.freedesktop.NetworkManager.pkla
  register: network_pkla_stat

- name: Copy org.freedesktop.NetworkManager.pkla to 50-local.d
  ansible.builtin.shell: |
    mkdir -p /etc/polkit-1/localauthority/50-local.d
    cp -f /var/lib/polkit-1/localauthority/10-vendor.d/org.freedesktop.NetworkManager.pkla \
      /etc/polkit-1/localauthority/50-local.d
  when:
    - manage_network|bool
    - ansible_facts['distribution_major_version']|int <= 12
  changed_when: not network_pkla_stat.stat.exists

# NetworkManager only *Recommends* polkitd, so a minimal Trixie image
# (e.g. Armbian on a Rock Pi / Orange Pi) can ship NM without it. Without
# polkit there is no /etc/polkit-1/rules.d for the rules file below, and
# no daemon to enforce the rule that lets the netdev/sudo user manage the
# connection — so install it explicitly on the Trixie+ manage-network
# path. The package owns /etc/polkit-1/rules.d, so the copy task that
# follows then has its destination directory.
- name: Ensure polkit is installed for NetworkManager (Trixie+)
  ansible.builtin.apt:
    name: polkitd
    state: present
  when:
    - manage_network|bool
    - ansible_facts['distribution_major_version']|int >= 13

- name: Create polkit rules for NetworkManager (Trixie+)
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/50-network-manager.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      polkit.addRule(function(action, subject) {
          if (action.id.indexOf("org.freedesktop.NetworkManager.") === 0 &&
              (subject.isInGroup("netdev") || subject.isInGroup("sudo") ||
               subject.user === "{{ anthias_user }}")) {
              return polkit.Result.YES;
          }
      });
  when:
    - manage_network|bool
    - ansible_facts['distribution_major_version']|int >= 13

- name: Gather service facts
  ansible.builtin.service_facts:
  when:
    - ansible_facts['distribution_major_version']|int >= 9
    - ansible_facts['distribution_major_version']|int <= 11
    - manage_network|bool

- name: Disable dhcpcd
  ansible.builtin.systemd:
    state: stopped
    name: dhcpcd
    enabled: false
  when:
    - ansible_facts['distribution_major_version']|int >= 9
    - ansible_facts['distribution_major_version']|int <= 11
    - manage_network|bool
    - "'dhcpcd.service' in ansible_facts.services"

- name: Activate NetworkManager
  ansible.builtin.systemd:
    state: started
    name: NetworkManager
    enabled: true
  when:
    - ansible_facts['distribution_major_version']|int >= 9
    - manage_network|bool

# --- wifi-connect ---------------------------------------------------
#
# Captive-portal provisioning for a device that has no network yet.
# The tool itself (Screenly-Labs/wifi-connect) runs as the
# anthias-wifi-connect container defined in the compose templates;
# this unit is only what starts one run of it per boot. See
# docs/wifi-setup.md.
#
# Gated on manage_network because that is the operator's explicit
# answer to "should Anthias touch this device's networking". A device
# installed with MANAGE_NETWORK=No has no NetworkManager at all (see
# install.sh), and raising an access point on it would be exactly the
# thing they declined.
- name: Install Anthias WiFi Connect systemd unit
  ansible.builtin.template:
    src: anthias-wifi-connect.service
    dest: /etc/systemd/system/anthias-wifi-connect.service
    mode: "0644"  # NOSONAR - systemd units are world-readable
    owner: root
    group: root
  when: manage_network|bool
  notify: Reload systemd daemon

# Enabled, not started. install.sh runs this playbook before
# `docker compose up`, so on a fresh install the container the unit
# attaches to does not exist yet; the first real run is the one the
# compose bring-up does, and every run after that is this unit at
# boot.
- name: Enable Anthias WiFi Connect systemd unit
  ansible.builtin.systemd:
    name: anthias-wifi-connect.service
    enabled: true
    daemon_reload: true
  when: manage_network|bool

# The inverse path: a device re-installed with MANAGE_NETWORK=No must
# stop raising access points. Idempotent where the unit was never
# installed.
- name: Check for Anthias WiFi Connect unit when network is unmanaged
  ansible.builtin.stat:
    path: /etc/systemd/system/anthias-wifi-connect.service
  register: network_wifi_connect_unit
  when: not manage_network|bool

- name: Disable Anthias WiFi Connect systemd unit
  ansible.builtin.systemd:
    name: anthias-wifi-connect.service
    state: stopped
    enabled: false
  when:
    - not manage_network|bool
    - network_wifi_connect_unit.stat.exists | default(false)
  failed_when: false

- name: Remove Anthias WiFi Connect systemd unit
  ansible.builtin.file:
    path: /etc/systemd/system/anthias-wifi-connect.service
    state: absent
  when: not manage_network|bool
  notify: Reload systemd daemon
