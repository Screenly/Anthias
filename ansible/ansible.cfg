# install.sh runs `ansible-playbook site.yml` from this directory, so this
# is the config Ansible picks up for an Anthias install.
[defaults]
# ansible-core 2.24 drops the legacy behaviour of injecting every gathered
# fact as a top-level variable (`ansible_distribution_major_version` and
# friends). Until then it only warns — noisily, once per templated
# reference, which buried real output in the installer log (SIRI-82).
# Turning the injection off now makes the playbook use `ansible_facts[...]`
# exclusively and keeps a bare-fact reference from creeping back in: it
# fails loudly instead of silently warning.
inject_facts_as_vars = False
