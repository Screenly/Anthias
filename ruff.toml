line-length = 79
exclude = [
    "src/anthias_server/app/migrations/*.py",
    "src/anthias_server/api/migrations/*.py",
    # Vendored verbatim from a pinned Yocto/poky upstream commit; see
    # the file header. Reformatting would put the file off-pin and
    # silently break the provenance comment.
    "src/anthias_webview/sysroot-relativelinks.py",
    # Build-time-only stdlib shims (imp/pipes/cgi) copied into the Qt 5
    # toolchain builder image to satisfy Chromium 87's Python-2-era build
    # tooling on Debian trixie's Python 3.13. Not app code; they emulate
    # removed-stdlib APIs, so app formatting/typing rules don't apply.
    "src/anthias_webview/pyshim/*.py",
]
target-version = "py313"

[lint]
# Pin the legacy default rule set (pycodestyle E4/E7/E9 + Pyflakes F).
# Ruff 0.16.0 expanded its *default* selection from 59 to 413 rules, so
# without an explicit `select` a routine ruff bump silently enables ~350
# new rules (464 findings on this tree at the time of writing). Keeping
# the historical default here makes ruff upgrades behaviour-preserving;
# adopting new rule families is a deliberate, separate change.
select = ["E4", "E7", "E9", "F"]

[format]
quote-style = "single"
